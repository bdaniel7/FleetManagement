# ── FleetOS NATS Server Configuration ────────────────────────
# JetStream-enabled with role-based username/password auth.
# Two accounts:
#   fleet_simulator  — can only publish to fleet.telemetry.*
#   fleet_api        — can subscribe and manage JetStream streams
#   fleet_admin      — full access (ops tooling, nats CLI)
#
# Passwords are injected at runtime via environment variables.
# In production, rotate passwords and consider switching to NKeys.

# JetStream-enabled, single-node, suitable for development and
# small production deployments. For clustering, add a cluster {}
# block and point peers at each other.

server_name: fleet-nats

# Client connections
host:      0.0.0.0
port:      4222

# HTTP monitoring endpoint (useful for nats-top, health checks)
http_port: 8222

# Logging — keep concise in production; set debug: false
#log_time:  true
debug:     false
trace:     false

# JetStream — persists messages to disk inside the container volume
jetstream {
  store_dir: /data/jetstream

  # Max total storage across all streams
  max_memory_store: 512MB
  max_file_store:   4GB
}

# ── Authorization ──────────────────────────────────────────────
# Passwords reference environment variables — NATS expands $VAR
# at startup. Set them in docker-compose.yml or a .env file.
# Generate bcrypt hashes with:  nats server passwd
# Or use plaintext in development.

authorization {
  users = [
    # Simulator: publish-only on fleet.telemetry.*
    {
      user:     $NATS_SIMULATOR_USER
      password: $NATS_SIMULATOR_PASS
      permissions: {
        publish:   { allow: ["fleet.telemetry.>"] }
        subscribe: { deny:  [">"] }
      }
    }

    # API backend: subscribe + JetStream management
    {
      user:     $NATS_API_USER
      password: $NATS_API_PASS
      permissions: {
        publish:   { allow: ["$JS.API.>", "fleet.telemetry.>"] }
        subscribe: { allow: ["fleet.telemetry.>", "_INBOX.>", "$JS.ACK.>", "$JS.API.>"] }
      }
    }

    # Admin: unrestricted — for nats CLI and ops tooling only
    {
      user:     $NATS_ADMIN_USER
      password: $NATS_ADMIN_PASS
      permissions: {
        publish:   { allow: [">"] }
        subscribe: { allow: [">"] }
      }
    }
  ]

  timeout: 5
}

# ── Connection limits ──────────────────────────────────────────
# Per-connection limits (tune for fleet size)
max_connections:       1024
max_payload:           1MB      # max single message size
max_pending:           64MB     # per-subscription pending buffer

# Slow consumer threshold before server drops the connection
write_deadline: "10s"
