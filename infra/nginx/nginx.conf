worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time corr=$http_x_correlation_id';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ───────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1000;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/wasm image/svg+xml;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options           DENY                        always;
    add_header X-Content-Type-Options    nosniff                     always;
    add_header X-XSS-Protection          "1; mode=block"             always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Rate limiting zones ───────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:10m      rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=telemetry_limit:10m rate=300r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── API upstream (round-robin across two Akka cluster nodes) ──
    upstream fleet_api {
        least_conn;
        server api-node1:5000 max_fails=3 fail_timeout=30s;
        server api-node2:5000 max_fails=3 fail_timeout=30s backup;
        keepalive 32;
    }

    # ── WebSocket map ─────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP → HTTPS redirect (enable in production) ──────────
    # server {
    #     listen 80;
    #     return 301 https://$host$request_uri;
    # }

    # ── Main server block ─────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 8m;

        # Correlation ID passthrough
        add_header X-Correlation-ID $request_id always;

        # ── Static frontend ───────────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;

            # Cache busting for hashed assets
            location ~* \.(js|css|wasm|png|svg|ico|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ── REST API ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass         http://fleet_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Correlation-ID  $request_id;
            proxy_set_header   Connection        "";   # keepalive
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;

            # Telemetry endpoint — higher rate limit
            location /api/vehicles/telemetry {
                limit_req zone=telemetry_limit burst=50 nodelay;
                proxy_pass http://fleet_api;
            }
        }

        # ── SignalR WebSocket hub ─────────────────────────────
        location /hubs/ {
            proxy_pass         http://fleet_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;   # long-lived WS connections
            proxy_send_timeout 86400s;
            proxy_buffering    off;
        }

        # ── Swagger (dev only — remove in prod) ───────────────
        location /swagger/ {
            proxy_pass http://fleet_api;
            proxy_set_header Host $host;
        }

        # ── Health check endpoint (no rate limit) ─────────────
        location = /api/fleet/health {
            proxy_pass http://fleet_api;
            access_log off;
        }
    }
}
