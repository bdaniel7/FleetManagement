# ── FleetOS RabbitMQ Configuration ───────────────────────────
# Loads definitions.json at startup to pre-create users, vhost,
# exchange, queue, and bindings declaratively.

# Load definitions on startup (idempotent)
load_definitions = /etc/rabbitmq/definitions.json

# Management plugin already bundled in the management image
management.load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console      = true
log.console.level = info

# Heartbeat — disconnect idle connections after 60s
heartbeat = 60

# Max message size 1MB
max_message_size = 1048576
